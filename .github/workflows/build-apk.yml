name: Build GharNaksha 3D APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir project
          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)
          echo "ZIP = $ZIP"
          unzip -q "$ZIP" -d project

      - name: Find project folder
        run: |
          echo "Project files:"
          find project -name settings.gradle.kts -o -name build.gradle.kts

      - name: Set Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Configure Android plugins
        run: |
          cd project
          SETTINGS=$(find . -name settings.gradle.kts | head -n 1)
          ROOT=$(dirname "$SETTINGS")
          cd "$ROOT"

          python3 - <<'PY'
          from pathlib import Path

          p = Path("settings.gradle.kts")
          s = p.read_text()

          if "pluginManagement" in s and "plugins {" not in s:
              s = s.replace(
                  "pluginManagement {",
                  """pluginManagement {
              plugins {
                  id("com.android.application") version "8.7.3"
                  id("org.jetbrains.kotlin.android") version "2.0.21"
                  id("org.jetbrains.kotlin.plugin.compose") version "2.0.21"
              }
          """,
                  1
              )

          p.write_text(s)
          PY

      - name: Build APK
        run: |
          cd project
          ROOT=$(dirname "$(find . -name settings.gradle.kts | head -n 1)")
          cd "$ROOT"
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GharNaksha-3D-APK
          path: project/**/app/build/outputs/apk/debug/*.apk
